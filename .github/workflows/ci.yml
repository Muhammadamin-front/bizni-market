name: CI
on:
  push: { branches: [main] }
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm --filter @shop/api build && pnpm --filter @shop/worker build && pnpm --filter @shop/mock-moysklad build
      - run: API_INTERNAL_URL=http://api:4000 pnpm --filter @shop/web build
      - name: No server-only strings in browser bundles
        run: node scripts/check-bundle-secrets.mjs
      - name: Dependency audit (production deps; fails on high severity)
        run: pnpm audit --prod --audit-level high

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile --target api -t shop-api .
      - run: docker build -f deploy/Dockerfile --target web -t shop-web .
